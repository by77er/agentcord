[package]
name = "agentcord-discord"
description = "Discord bridge: mirrors an agentcord topic into a channel and posts humans' replies as @human"
version.workspace = true
edition.workspace = true

[dependencies]
agentcord-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "rustls_backend", "builder"] }
tokio.workspace = true
tokio-tungstenite = "0.30.0"
