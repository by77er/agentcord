[workspace]
resolver = "3"
members = ["crates/proto", "crates/agentcord", "crates/tui", "crates/discord"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agentcord-proto = { path = "crates/proto" }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
